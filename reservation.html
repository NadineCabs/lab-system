<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservations - CCS Sit-In Monitoring</title>
  <link rel="stylesheet" href="../css/dashboard-student-style.css">
  <script src="https://unpkg.com/feather-icons"></script>
  <style>
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .page-header h1 {
      color: #333;
      font-size: 28px;
      margin: 0;
    }

    .btn-new-reservation {
      background: linear-gradient(135deg, #703081 0%, #a00080 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.2s;
    }

    .btn-new-reservation:hover {
      transform: scale(1.05);
    }

    .tabs {
      display: flex;
      gap: 0;
      border-bottom: 2px solid #e0e0e0;
      margin-bottom: 20px;
    }

    .tab-btn {
      background: none;
      border: none;
      padding: 15px 20px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      color: #666;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
    }

    .tab-btn.active {
      color: #703081;
      border-bottom-color: #703081;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .reservation-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .reservation-card {
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 20px;
      transition: all 0.2s;
    }

    .reservation-card:hover {
      box-shadow: 0 4px 12px rgba(112, 48, 129, 0.1);
      border-color: #703081;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 15px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      color: #333;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .status-pending {
      background-color: #fff3cd;
      color: #856404;
    }

    .status-approved {
      background-color: #d4edda;
      color: #155724;
    }

    .status-rejected {
      background-color: #f8d7da;
      color: #721c24;
    }

    .status-cancelled {
      background-color: #e2e3e5;
      color: #383d41;
    }

    .card-details {
      font-size: 14px;
      color: #666;
      margin-bottom: 15px;
      line-height: 1.6;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .detail-label {
      font-weight: 600;
      color: #333;
    }

    .rejected-reason {
      background-color: #fff3cd;
      border-left: 4px solid #ffc107;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .card-actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .btn-small {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-start {
      background: #703081;
      color: white;
      border-color: #703081;
    }

    .btn-start:hover {
      background: #a00080;
      border-color: #a00080;
    }

    .btn-cancel {
      background: white;
      color: #d32f2f;
      border-color: #d32f2f;
    }

    .btn-cancel:hover {
      background: #ffebee;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #999;
    }

    .empty-state h3 {
      color: #666;
      margin-bottom: 10px;
    }

    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: white;
      border-radius: 8px;
      padding: 30px;
      max-width: 600px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    }

    .modal-header {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 28px;
      cursor: pointer;
      color: #999;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #333;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: #703081;
      box-shadow: 0 0 0 3px rgba(112, 48, 129, 0.1);
    }

    .modal-footer {
      display: flex;
      gap: 10px;
      margin-top: 25px;
      justify-content: flex-end;
    }

    .btn-modal {
      padding: 12px 24px;
      border: 1px solid #ddd;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-submit {
      background: #703081;
      color: white;
      border-color: #703081;
    }

    .btn-submit:hover {
      background: #a00080;
    }

    .btn-cancel-modal {
      background: white;
      color: #666;
    }

    .btn-cancel-modal:hover {
      background: #f5f5f5;
    }

    .loading {
      opacity: 0.5;
      pointer-events: none;
    }

    .success-message {
      background: #d4edda;
      color: #155724;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      display: none;
    }

    .error-message {
      background: #f8d7da;
      color: #721c24;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      display: none;
    }

    .loading-spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #f3f3f3;
      border-top: 3px solid #703081;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Top Navigation Bar -->
  <nav class="top-nav">
    <div class="nav-container">
      <div class="nav-left">
        <h2>Reservations</h2>
      </div>
      <div class="nav-right">
        <a href="dashboard.html" class="nav-link">
          <i data-feather="home"></i>
          <span>Home</span>
        </a>
        
        <a href="#" onclick="openEditProfileModal(); return false;" class="nav-link">
          <i data-feather="user"></i>
          <span>Edit Profile</span>
        </a>
        
        <a href="history.html" class="nav-link">
          <i data-feather="clock"></i>
          <span>History</span>
        </a>
        
        <a href="reservation.html" class="nav-link">
          <i data-feather="calendar"></i>
          <span>Reservation</span>
        </a>
        
        <button onclick="logout()" class="btn-logout">
          <i data-feather="log-out"></i>
          <span>Log out</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container">
    <div class="page-header">
      <h1>Sit-In Reservations</h1>
      <button class="btn-new-reservation" onclick="openReservationModal()">
        <i data-feather="plus"></i>
        Make a Reservation
      </button>
    </div>

    <!-- Messages -->
    <div class="success-message" id="successMessage"></div>
    <div class="error-message" id="errorMessage"></div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('pending')">Pending & Approved</button>
      <button class="tab-btn" onclick="switchTab('all')">All Reservations</button>
    </div>

    <!-- Pending Tab -->
    <div id="pending-tab" class="tab-content active">
      <div id="pendingContainer"></div>
    </div>

    <!-- All Tab -->
    <div id="all-tab" class="tab-content">
      <div id="allContainer"></div>
    </div>
  </div>

  <!-- Reservation Modal -->
  <div id="reservationModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <span>Make a Reservation</span>
        <button class="modal-close" onclick="closeReservationModal()">×</button>
      </div>
      <form id="reservationForm" onsubmit="submitReservation(event)">
        <div class="form-group">
          <label>Computer Number *</label>
          <input type="text" id="computerNumber" placeholder="e.g., LAB-01, PC-05" required>
        </div>

        <div class="form-group">
          <label>Purpose *</label>
          <textarea id="purpose" placeholder="What will you be working on?" required></textarea>
        </div>

        <div class="form-group">
          <label>Date *</label>
          <input type="date" id="requestedDate" required>
        </div>

        <div class="form-group">
          <label>Time *</label>
          <input type="time" id="requestedTime" required>
        </div>

        <div class="form-group">
          <label>Duration (hours) *</label>
          <select id="durationHours" required>
            <option value="">Select duration</option>
            <option value="1">1 hour</option>
            <option value="2">2 hours</option>
            <option value="3">3 hours</option>
            <option value="4">4 hours</option>
            <option value="5">5 hours</option>
            <option value="6">6 hours</option>
            <option value="7">7 hours</option>
            <option value="8">8 hours</option>
          </select>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-modal btn-cancel-modal" onclick="closeReservationModal()">Cancel</button>
          <button type="submit" class="btn-modal btn-submit">Submit Reservation</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const user = JSON.parse(sessionStorage.getItem('user') || 'null');
    if (!user || user.role !== 'student') {
      window.location.href = 'index.html';
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadReservations();
      feather.replace();
      setMinDate();
    });

    function setMinDate() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('requestedDate').min = today;
    }

    function switchTab(tab) {
      // Update buttons
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      // Update content
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      
      if (tab === 'pending') {
        document.getElementById('pending-tab').classList.add('active');
        loadReservations('pending');
      } else {
        document.getElementById('all-tab').classList.add('active');
        loadReservations('all');
      }
    }

    async function loadReservations(filter = 'pending') {
      const url = filter === 'pending' 
        ? 'api-get-student-reservations.php?status=pending'
        : 'api-get-student-reservations.php';

      const containerId = filter === 'pending' ? 'pendingContainer' : 'allContainer';
      const container = document.getElementById(containerId);

      try {
        container.innerHTML = '<div style="text-align: center; padding: 40px;"><div class="loading-spinner"></div><p>Loading...</p></div>';

        const response = await fetch(url);
        const data = await response.json();

        if (!data.success) {
          container.innerHTML = `<div class="empty-state"><h3>Error</h3><p>${data.message}</p></div>`;
          return;
        }

        if (data.reservations.length === 0) {
          container.innerHTML = `<div class="empty-state"><i data-feather="inbox"></i><h3>No reservations</h3><p>You haven't made any ${filter === 'pending' ? 'pending or approved' : ''} reservations yet.</p></div>`;
          feather.replace();
          return;
        }

        let html = '<div class="reservation-grid">';
        data.reservations.forEach(res => {
          const dateObj = new Date(res.requested_date);
          const dateStr = dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
          const timeStr = res.requested_time.slice(0, 5);

          let actions = '';
          if (res.status === 'pending') {
            actions = `<button class="btn-small btn-cancel" onclick="cancelReservation(${res.id})">Cancel</button>`;
          } else if (res.status === 'approved') {
            actions = `
              <button class="btn-small btn-start" onclick="startSession(${res.id})">Start Session</button>
              <button class="btn-small btn-cancel" onclick="cancelReservation(${res.id})">Cancel</button>
            `;
          }

          html += `
            <div class="reservation-card">
              <div class="card-header">
                <div class="card-title">Lab ${res.computer_number}</div>
                <span class="status-badge status-${res.status}">${res.status}</span>
              </div>
              <div class="card-details">
                <div class="detail-row">
                  <span class="detail-label">Date:</span>
                  <span>${dateStr}</span>
                </div>
                <div class="detail-row">
                  <span class="detail-label">Time:</span>
                  <span>${timeStr}</span>
                </div>
                <div class="detail-row">
                  <span class="detail-label">Duration:</span>
                  <span>${res.duration_hours} hour(s)</span>
                </div>
                <div class="detail-row">
                  <span class="detail-label">Purpose:</span>
                  <span>${res.purpose}</span>
                </div>
              </div>
              ${res.status === 'rejected' ? `<div class="rejected-reason"><strong>Rejection Reason:</strong><br>${res.rejection_reason || 'No reason provided'}</div>` : ''}
              <div class="card-actions">
                ${actions}
              </div>
            </div>
          `;
        });
        html += '</div>';

        container.innerHTML = html;
        feather.replace();
      } catch (error) {
        console.error('Error loading reservations:', error);
        container.innerHTML = `<div class="empty-state"><h3>Error</h3><p>Failed to load reservations. Please refresh and try again.</p></div>`;
      }
    }

    function openReservationModal() {
      document.getElementById('reservationModal').classList.add('show');
      feather.replace();
    }

    function closeReservationModal() {
      document.getElementById('reservationModal').classList.remove('show');
      document.getElementById('reservationForm').reset();
    }

    async function submitReservation(event) {
      event.preventDefault();

      const computerNumber = document.getElementById('computerNumber').value;
      const purpose = document.getElementById('purpose').value;
      const requestedDate = document.getElementById('requestedDate').value;
      const requestedTime = document.getElementById('requestedTime').value;
      const durationHours = parseInt(document.getElementById('durationHours').value);

      try {
        const response = await fetch('api-create-reservation.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            computer_number: computerNumber,
            purpose: purpose,
            requested_date: requestedDate,
            requested_time: requestedTime,
            duration_hours: durationHours
          })
        });

        const data = await response.json();

        if (data.success) {
          showMessage(data.message, 'success');
          closeReservationModal();
          setTimeout(() => loadReservations(), 1000);
        } else {
          showMessage(data.message, 'error');
        }
      } catch (error) {
        showMessage('Error submitting reservation. Please try again.', 'error');
      }
    }

    async function cancelReservation(reservationId) {
      if (!confirm('Are you sure you want to cancel this reservation?')) return;

      try {
        const response = await fetch('api-cancel-reservation.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reservation_id: reservationId })
        });

        const data = await response.json();

        if (data.success) {
          showMessage('Reservation cancelled', 'success');
          setTimeout(() => loadReservations(), 500);
        } else {
          showMessage(data.message, 'error');
        }
      } catch (error) {
        showMessage('Error cancelling reservation', 'error');
      }
    }

    async function startSession(reservationId) {
      if (!confirm('Start your sit-in session now?')) return;

      try {
        const response = await fetch('api-start-session-from-reservation.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reservation_id: reservationId })
        });

        const data = await response.json();

        if (data.success) {
          showMessage('Session started! You can now end it from the admin panel.', 'success');
          setTimeout(() => window.location.href = 'dashboard.html', 1500);
        } else {
          showMessage(data.message, 'error');
        }
      } catch (error) {
        showMessage('Error starting session', 'error');
      }
    }

    function showMessage(message, type) {
      const container = type === 'success' ? document.getElementById('successMessage') : document.getElementById('errorMessage');
      container.textContent = message;
      container.style.display = 'block';
      setTimeout(() => { container.style.display = 'none'; }, 5000);
    }

    // Profile and logout functions (shared with dashboard)
    function openEditProfileModal() {
      alert('Edit profile functionality would open here');
    }

    function logout() {
      fetch('logout.php', { method: 'POST' })
        .then(() => {
          sessionStorage.removeItem('user');
          window.location.href = 'index.html';
        });
    }
  </script>
</body>
</html>
